<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Headroom: a screen with its top edge lit (tools/make_icons.py draws the same geometry for the PNGs) -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121722"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2f4ff"/>
      <stop offset="1" stop-color="#8fd2ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#plate)"/>
  <rect x="141" y="195" width="230" height="47" rx="23.5" fill="#2b99e7" opacity=".75" filter="url(#glow)"/>
  <rect x="84" y="138" width="344" height="236" rx="46" fill="none" stroke="#eef1f6" stroke-width="33"/>
  <rect x="141" y="195" width="230" height="47" rx="23.5" fill="url(#band)"/>
</svg>
