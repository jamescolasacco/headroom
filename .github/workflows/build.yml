# Builds Headroom for macOS (universal) and Windows (x64), runs the end-to-end checks against the built hosts,
# and on a version tag (v1.2.3) publishes a GitHub release with the downloads.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Account server and web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Account server tests
        run: node account-server/test.mjs
      - name: Viewer, offline cache and account storage regressions
        run: node --test tests/*.test.mjs
      - name: Syntax check (web client, tools)
        run: for f in web/js/*.js web/js/*/*.js web/sw.js tools/*.mjs account-server/*.mjs; do node --check "$f"; done
      - name: Linux service install (tools/install-account-server-linux.sh)
        run: |
          login() {
            curl -fs -X POST -H 'Content-Type: application/json' -d '{"email":"ci-admin@example.com","password":"quartz-lantern-ferry-81","deviceName":"ci"}' \
              http://127.0.0.1:8790/api/account/login | grep -q '"token"'
          }
          sudo tools/install-account-server-linux.sh --port 8790 --url https://headroom.example.com
          curl -fs http://127.0.0.1:8790/api/info | grep -q '"signup":true'
          sudo test -f /etc/headroom-accounts.env
          test "$(sudo stat -c %a /etc/headroom-accounts.env)" = 600
          # An account made from the command line (the running service is stopped and started around it).
          echo 'quartz-lantern-ferry-81' | sudo headroom-accounts add-user ci-admin@example.com
          sudo headroom-accounts list-users | grep -q ci-admin@example.com
          for i in $(seq 20); do curl -fs http://127.0.0.1:8790/api/info > /dev/null && break; sleep 0.5; done
          login
          # Settings in the env file are kept and applied; updating keeps the account.
          echo 'SIGNUP=closed' | sudo tee -a /etc/headroom-accounts.env > /dev/null
          sudo tools/install-account-server-linux.sh --port 8790
          curl -fs http://127.0.0.1:8790/api/info | grep -q '"signup":false'
          login
          sudo tools/install-account-server-linux.sh --uninstall

  macos:
    name: macOS (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            host-macos/.build
            viewer-macos/.build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('host-macos/Package.resolved', 'host-macos/Package.swift', 'viewer-macos/Package.swift') }}
      - name: Signing certificate
        # Headroom's own certificate (tools/make-signing-cert.sh): every build signed by the same key, so macOS keeps
        # Screen Recording and Accessibility across updates. Without the secrets the signature is ad-hoc; a tag build
        # then fails if the repository has a certificate, because the apps would refuse that release.
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* && -f assets/headroom-signing.cer ]]; then
              echo "::error::MACOS_SIGN_P12 isn't set, but assets/headroom-signing.cer exists: run tools/make-signing-cert.sh"; exit 1
            fi
            echo "No signing certificate: ad-hoc signature (macOS asks for its permissions again after each update)."
            exit 0
          fi
          KC="$RUNNER_TEMP/headroom-signing.keychain-db"
          KCPW="$(openssl rand -hex 24)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          (umask 077; printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12")
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate isn't trusted by macOS, so codesign takes it by its SHA-1.
          ID="$(security find-identity -p codesigning "$KC" | awk '/\)/ {print $2; exit}')"
          [ -n "$ID" ] || { echo "::error::MACOS_SIGN_P12 holds no code-signing identity"; exit 1; }
          if [ -f assets/headroom-signing.cer ]; then
            want="$(openssl x509 -inform DER -in assets/headroom-signing.cer -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
            [ "$want" = "$ID" ] || { echo "::error::MACOS_SIGN_P12 isn't the certificate in assets/headroom-signing.cer"; exit 1; }
          fi
          echo "HEADROOM_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "Signing with the certificate $ID"
      - name: Build Headroom Server and Headroom Viewer
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export HEADROOM_VERSION="${GITHUB_REF_NAME#v}"; fi
          tools/build-macos.sh --universal
      - name: Host, updater and installer regressions
        run: |
          swift test --package-path host-macos -c release
          swift test --package-path update-macos -c release
          bash tests/build-macos.sh
          bash tests/install-macos.sh
      - name: Check the signatures
        if: env.HEADROOM_SIGN_IDENTITY != ''
        run: |
          for app in "dist/Headroom Server.app" "dist/Headroom Viewer.app"; do
            codesign -dr - "$app" 2>&1 | tee /dev/stderr | grep -q 'certificate root = H"' || { echo "::error::$app isn't signed with the certificate"; exit 1; }
            if [ -f assets/headroom-signing.cer ]; then cmp "$app/Contents/Resources/update-signing.cer" assets/headroom-signing.cer; fi
          done
      - name: Package
        run: tools/package-macos.sh
      - name: Start the host (test pattern) and an account server
        run: |
          # DEV_MAIL: emailed codes go to a test mailbox. The host uses this account server, never the public one.
          DATA_DIR="$RUNNER_TEMP/accounts" PORT=8780 BIND=127.0.0.1 DEV_MAIL=1 nohup node account-server/server.mjs > "$RUNNER_TEMP/accounts.log" 2>&1 &
          mkdir -p "$RUNNER_TEMP/host" && echo '{"server":"http://127.0.0.1:8780"}' > "$RUNNER_TEMP/host/config.json"
          nohup "dist/Headroom Server.app/Contents/MacOS/headroom" run --data="$RUNNER_TEMP/host" --loopback --test-pattern=1280x720 > "$RUNNER_TEMP/host.log" 2>&1 &
          for i in $(seq 60); do
            curl -fs http://127.0.0.1:7080/api/info > /dev/null && curl -fs http://127.0.0.1:8780/api/info > /dev/null && exit 0
            sleep 1
          done
          echo "the host or the account server didn't start"; cat "$RUNNER_TEMP/host.log" "$RUNNER_TEMP/accounts.log"; exit 1
      - name: Accounts and relay check
        run: node tools/account-check.mjs --account=http://127.0.0.1:8780 --email=ci-test@example.com --password=quartz-lantern-ferry-81 --register --check-uploads
      - name: Guest code and protocol check
        run: node tools/protocol-check.mjs --url=http://127.0.0.1:7080 --seconds=4 --out="$RUNNER_TEMP/check.h264"
      - name: Stream check (a viewer on an 80 ms path keeps its bitrate)
        # A stream that sends little (the screen barely changes) on a path over ~60 ms once looked congested and
        # fell to its 800 kbps floor: blurry over any relay. Fails if the host's target drops under 6 Mb/s.
        run: node tools/stream-check.mjs --url=http://127.0.0.1:7080 --seconds=10 --ack-delay=80 --ack-jitter=10 --link-kbps=20000 --min-target-kbps=6000 --out="$RUNNER_TEMP/stream.h264" --quiet
      - name: Host log
        if: always()
        run: tail -n 60 "$RUNNER_TEMP/host.log" || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Headroom Server and Headroom Viewer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '' }
          ./tools/publish.ps1 -Version $version
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Compress-Archive -Path dist/Headroom -DestinationPath dist/release/Headroom-Server-Windows-x64.zip
          Compress-Archive -Path dist/HeadroomViewer -DestinationPath dist/release/Headroom-Viewer-Windows-x64.zip
      - name: Installers
        # What people download (and what the apps' updaters run, silently): Inno Setup, from tools/windows-installer.
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc -ErrorAction Stop).Source }
          $v = ((Get-Item dist\Headroom\HeadroomServer.exe).VersionInfo.ProductVersion -split '[+-]')[0]
          foreach ($iss in 'HeadroomServer', 'HeadroomViewer') {
            & $iscc /Q "/DVersion=$v" "tools\windows-installer\$iss.iss"
            if ($LASTEXITCODE -ne 0) { throw "$iss.iss didn't build" }
          }
          Get-ChildItem dist/release | Format-Table Name, Length
      - name: Accounts, relay and guest code checks
        # One step: on Windows runners, processes started in a step end with it.
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          $env:DATA_DIR = "$t\accounts"; $env:PORT = '8780'; $env:BIND = '127.0.0.1'; $env:DEV_MAIL = '1'
          $acct = Start-Process node -ArgumentList 'account-server/server.mjs' -PassThru -RedirectStandardOutput "$t\accounts.log" -RedirectStandardError "$t\accounts.err"
          $env:HEADROOM_BIND = 'loopback'
          # The host uses this account server, never the public one.
          New-Item -ItemType Directory -Force "$t\host" | Out-Null
          Set-Content -Path "$t\host\config.json" -Value '{"server":"http://127.0.0.1:8780"}' -Encoding ascii
          $hostProc = Start-Process dist\Headroom\headroom.exe -ArgumentList 'run', "--data=$t\host" -PassThru -RedirectStandardOutput "$t\host.out" -RedirectStandardError "$t\host.err"
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $up; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:7080/api/info | Out-Null; Invoke-RestMethod http://127.0.0.1:8780/api/info | Out-Null; $up = $true } catch { Start-Sleep 1 }
          }
          $code = 1
          if ($up) {
            # Video can't stream on a runner without a desktop: the checks skip it; everything else must pass.
            node tools/account-check.mjs --account=http://127.0.0.1:8780 --email=ci-test@example.com --password=quartz-lantern-ferry-81 --register --check-uploads --frames=0
            $code = $LASTEXITCODE
            node tools/protocol-check.mjs --url=http://127.0.0.1:7080 --no-video
            if ($LASTEXITCODE -ne 0) { $code = $LASTEXITCODE }
            # This shows how far a stream gets on the runner, without failing the build.
            node tools/protocol-check.mjs --url=http://127.0.0.1:7080 --seconds=4 --out="$t\check.h264"
            Write-Host "protocol-check with video exit code: $LASTEXITCODE (informational)"
          } else { Write-Host "the host or the account server didn't start" }
          Write-Host "`n--- host log"; Get-Content "$t\host.out", "$t\host.err" -Tail 80 -ErrorAction SilentlyContinue
          Write-Host "`n--- account server log"; Get-Content "$t\accounts.log", "$t\accounts.err" -Tail 30 -ErrorAction SilentlyContinue
          Stop-Process -Id $hostProc.Id, $acct.Id -Force -ErrorAction SilentlyContinue
          exit $code
      - name: The installers install (and uninstall)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $silent = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # WaitForExit, not Start-Process -Wait: -Wait also waits for the apps the installers open at the end.
          function Run($exe, $log) {
            $p = Start-Process $exe -ArgumentList ($silent + "/LOG=$log") -PassThru; $p.WaitForExit()
            if ($p.ExitCode -ne 0) { throw "$exe exited $($p.ExitCode)" }
          }
          Run dist\release\Headroom-Viewer-Setup.exe "$env:RUNNER_TEMP\viewer-setup.log"
          $viewer = Join-Path $env:LOCALAPPDATA 'Programs\Headroom Viewer'
          if (-not (Test-Path "$viewer\HeadroomViewer.exe")) { throw "Headroom Viewer wasn't installed" }
          if (-not (Test-Path "$viewer\update-signing.cer") -and (Test-Path assets\headroom-signing.cer)) { throw "Headroom Viewer has no update-signing.cer" }
          Get-Process HeadroomViewer -ErrorAction SilentlyContinue | Stop-Process -Force
          Run dist\release\Headroom-Server-Setup.exe "$env:RUNNER_TEMP\server-setup.log"
          $dst = Join-Path $env:ProgramFiles 'Headroom'
          Select-String -Path "$env:RUNNER_TEMP\server-setup.log" -Pattern 'headroom service install|Exception|error' | ForEach-Object { $_.Line }
          if (-not (Test-Path "$dst\HeadroomServer.exe")) { throw "Headroom Server wasn't installed" }
          $svc = Get-Service Headroom -ErrorAction SilentlyContinue
          if (-not $svc) {
            Get-Content "$env:RUNNER_TEMP\server-setup.log" -Tail 40
            Write-Host "--- headroom service install, run again here:"
            & "$dst\headroom.exe" service install 2>&1 | ForEach-Object { Write-Host $_ }
            throw "the installer didn't create the Headroom service"
          }
          Write-Host "Headroom service: $($svc.Status), start $($svc.StartType)"
          Get-Process HeadroomServer -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          # The uninstallers hand over to a copy of themselves and return at once: give them a moment.
          Run "$dst\unins000.exe" "$env:RUNNER_TEMP\server-uninstall.log"
          Run "$viewer\unins000.exe" "$env:RUNNER_TEMP\viewer-uninstall.log"
          for ($i = 0; $i -lt 60; $i++) {
            if (!(Test-Path $dst) -and !(Test-Path $viewer) -and !(Get-Service Headroom -ErrorAction SilentlyContinue)) { break }
            Start-Sleep 1
          }
          if ((Test-Path $dst) -or (Test-Path $viewer) -or (Get-Service Headroom -ErrorAction SilentlyContinue)) {
            throw "Uninstall left a Headroom application directory or service behind"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          cd release
          # What the apps' updaters read first: the version, and which download is whose.
          printf '{"version":"%s","mac":"Headroom-macOS.zip","windowsServer":"Headroom-Server-Setup.exe","windowsViewer":"Headroom-Viewer-Setup.exe","release":"https://github.com/%s/releases/tag/%s"}\n' \
            "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > update.json
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [ -n "$P12" ]; then
            # Signed with Headroom's certificate: the apps install only releases whose checksums carry this signature.
            (umask 077; printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12")
            (umask 077; openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -nocerts -nodes -passin env:P12_PASSWORD -out "$RUNNER_TEMP/key.pem")
            openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -clcerts -nokeys -passin env:P12_PASSWORD | openssl x509 -outform DER -out "$RUNNER_TEMP/cert.der"
            if [ -f ../assets/headroom-signing.cer ] && ! cmp -s "$RUNNER_TEMP/cert.der" ../assets/headroom-signing.cer; then
              echo "::error::MACOS_SIGN_P12 isn't the certificate in assets/headroom-signing.cer"; exit 1
            fi
            openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out SHA256SUMS.txt.sig SHA256SUMS.txt
            openssl x509 -inform DER -in "$RUNNER_TEMP/cert.der" -pubkey -noout > "$RUNNER_TEMP/pub.pem"
            openssl dgst -sha256 -verify "$RUNNER_TEMP/pub.pem" -signature SHA256SUMS.txt.sig SHA256SUMS.txt
            rm -f "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/signing.p12"
          elif [ -f ../assets/headroom-signing.cer ]; then
            echo "::error::MACOS_SIGN_P12 isn't set, but assets/headroom-signing.cer exists: the apps would refuse this release"; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Headroom ${GITHUB_REF_NAME#v}" \
            --notes-file ../.github/RELEASE_NOTES.md *
