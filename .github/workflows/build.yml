# Builds Headroom for macOS (universal) and Windows (x64), runs the end-to-end checks against the built hosts,
# and on a version tag (v1.2.3) publishes a GitHub release with the downloads.
name: Build

on:
  push:
    branches: [master, macos]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Account server and web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Account server tests
        run: node account-server/test.mjs
      - name: Syntax check (web client, tools)
        run: for f in web/js/*.js web/js/*/*.js web/sw.js tools/*.mjs account-server/*.mjs; do node --check "$f"; done

  macos:
    name: macOS (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            host-macos/.build
            viewer-macos/.build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('host-macos/Package.resolved', 'host-macos/Package.swift', 'viewer-macos/Package.swift') }}
      - name: Build Headroom Server and Headroom Viewer
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export HEADROOM_VERSION="${GITHUB_REF_NAME#v}"; fi
          tools/build-macos.sh --universal
      - name: Package
        run: tools/package-macos.sh
      - name: Start the host (test pattern) and an account server
        run: |
          DATA_DIR="$RUNNER_TEMP/accounts" PORT=8780 BIND=127.0.0.1 nohup node account-server/server.mjs > "$RUNNER_TEMP/accounts.log" 2>&1 &
          nohup "dist/Headroom Server.app/Contents/MacOS/headroom" run --data="$RUNNER_TEMP/host" --loopback --test-pattern=1280x720 > "$RUNNER_TEMP/host.log" 2>&1 &
          for i in $(seq 60); do
            curl -fs http://127.0.0.1:7080/api/info > /dev/null && curl -fs http://127.0.0.1:8780/api/info > /dev/null && exit 0
            sleep 1
          done
          echo "the host or the account server didn't start"; cat "$RUNNER_TEMP/host.log" "$RUNNER_TEMP/accounts.log"; exit 1
      - name: Accounts check
        run: node tools/account-check.mjs --account=http://127.0.0.1:8780 --username=ci-test --password=ci-password-123 --register
      - name: Protocol check
        run: node tools/protocol-check.mjs --url=http://127.0.0.1:7080 --seconds=4 --out="$RUNNER_TEMP/check.h264"
      - name: Host log
        if: always()
        run: tail -n 60 "$RUNNER_TEMP/host.log" || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Headroom Server and Headroom Viewer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '' }
          ./tools/publish.ps1 -Version $version
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Compress-Archive -Path dist/Headroom -DestinationPath dist/release/Headroom-Server-Windows-x64.zip
          Compress-Archive -Path dist/HeadroomViewer -DestinationPath dist/release/Headroom-Viewer-Windows-x64.zip
          Get-ChildItem dist/release | Format-Table Name, Length
      - name: Start the host and an account server
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          $env:DATA_DIR = "$t\accounts"; $env:PORT = '8780'; $env:BIND = '127.0.0.1'
          Start-Process node -ArgumentList 'account-server/server.mjs' -RedirectStandardOutput "$t\accounts.log" -RedirectStandardError "$t\accounts.err"
          $env:HEADROOM_BIND = 'loopback'
          Start-Process dist\Headroom\headroom.exe -ArgumentList 'run', "--data=$t\host" -RedirectStandardOutput "$t\host.out" -RedirectStandardError "$t\host.err"
          for ($i = 0; $i -lt 90; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:7080/api/info | Out-Null; Invoke-RestMethod http://127.0.0.1:8780/api/info | Out-Null; exit 0 } catch { Start-Sleep 1 }
          }
          Write-Host "the host or the account server didn't start"
          Get-Content "$t\host.out", "$t\host.err", "$t\accounts.log", "$t\accounts.err" -ErrorAction SilentlyContinue
          exit 1
      - name: Accounts check
        run: node tools/account-check.mjs --account=http://127.0.0.1:8780 --username=ci-test --password=ci-password-123 --register
      - name: Protocol check
        # A hosted runner may have no desktop to capture; this shows how far the stream gets without blocking.
        continue-on-error: true
        run: node tools/protocol-check.mjs --url=http://127.0.0.1:7080 --seconds=4 --out=${{ runner.temp }}/check.h264
      - name: Host log
        if: always()
        shell: pwsh
        run: Get-Content "$env:RUNNER_TEMP\host.out", "$env:RUNNER_TEMP\host.err" -Tail 60 -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Headroom ${GITHUB_REF_NAME#v}" \
            --notes-file ../.github/RELEASE_NOTES.md *
